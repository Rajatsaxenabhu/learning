services:

  vllm:
    image: vllm/vllm-openai:latest

    container_name: gisproject-vllm

    restart: unless-stopped

    ipc: host

    ports:
      - "8000:8000"

    volumes:
      - huggingface-cache:/root/.cache/huggingface

    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}

    command:
      - --model=Qwen/Qwen3-8B-AWQ
      - --served-model-name=qwen3-8b
      - --quantization=awq

      # Increased context for multi-step agent execution
      - --max-model-len=16384

      # Use more GPU memory for KV cache
      - --gpu-memory-utilization=0.90

      # Tool calling
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes

      # Qwen3 reasoning parser
      - --reasoning-parser=qwen3

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  huggingface-cache: